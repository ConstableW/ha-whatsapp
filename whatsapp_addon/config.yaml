name: Whatsapp
version: "2.0.1"
slug: whatsapp_addon
description: Whatsapp addon for send message from Home Assistant
url: "https://github.com/ConstableW/ha-whatsapp/tree/main/whatsapp_addon"
homeassistant_api: true
hassio_api: true
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
init: false
ingress: true
ingress_port: 3000
panel_icon: mdi:whatsapp
panel_title: WhatsApp
panel_admin: true
map:
  - config:rw
  - media:rw
options:
  clients:
    - default
  disabled_clients: []
  client_labels: []
  receive_status: false
  inactivity_warning_days: 14
schema:
  clients:
    - str
  disabled_clients:
    - str?
  client_labels:
    - str?
  receive_status: bool?
  inactivity_warning_days: int(0,365)?
