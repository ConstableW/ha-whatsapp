send_message:
  name: Send message
  description: >-
    Send a Whatsapp message. For images, audio, locations and reactions use the
    YAML mode and pass an object as body (see the add-on documentation).
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should the message come from
      required: true
      example: default
      selector:
        text:
    to:
      name: Target User ID
      description: Target user (number@s.whatsapp.net) or group (id@g.us)
      required: true
      example: 391234567890@s.whatsapp.net
      selector:
        text:
    body:
      name: Message's body
      description: The text of the message
      required: true
      example: "Hello from Home Assistant"
      selector:
        text:
          multiline: true
    options:
      name: Options
      description: Optional send options, e.g. a quoted message
      required: false
      example: '{"quoted": "{{ trigger.event.data }}"}'
      selector:
        object:

set_status:
  name: Set status
  description: Sets the current user's status message
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
      selector:
        text:
    status:
      name: New status message
      description: New status message
      required: true
      example: Available
      selector:
        text:

presence_subscribe:
  name: Presence subscribe
  description: Subscribe to user presence update like online, offline, typing, etc... Please first use send infinity presence update service to always appear online.
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
      selector:
        text:
    to:
      name: Target User ID
      description: Target User ID
      required: true
      example: 391234567890@s.whatsapp.net
      selector:
        text:

send_presence_update:
  name: Send presence update
  description: Send presence update like online, offline, typing, etc...
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
      selector:
        text:
    type:
      name: Presence type
      description: Presence type
      required: true
      example: composing
      selector:
        select:
          options:
            - "unavailable"
            - "available"
            - "composing"
            - "recording"
            - "paused"
    to:
      name: Target User ID
      description: Target User ID
      required: false
      example: 391234567890@s.whatsapp.net
      selector:
        text:

send_infinity_presence_update:
  name: Send infinity presence update
  description: Send presence update like online, offline, typing, etc... for a long time
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
      selector:
        text:
    type:
      name: Presence type
      description: Presence type
      required: true
      example: composing
      selector:
        select:
          options:
            - "unavailable"
            - "available"
            - "composing"
            - "recording"
            - "paused"
    to:
      name: Target User ID
      description: Target User ID
      required: false
      example: 391234567890@s.whatsapp.net
      selector:
        text:

get_groups:
  name: Get groups
  description: Returns all groups the client is a member of (id, subject, participants). Use it with "response_variable".
  fields:
    clientId:
      name: Client ID
      description: Which instance of whatsapp should be used
      required: true
      example: default
      selector:
        text:
    refresh:
      name: Refresh
      description: Fetch the groups from WhatsApp again instead of using the cache (up to one minute old)
      required: false
      example: false
      selector:
        boolean:
